<VirtualHost *:80>
    ServerName mohidine.sn
    ServerAlias www.mohidine.sn

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/mohidine_error.log
    CustomLog ${APACHE_LOG_DIR}/mohidine_access.log combined
</VirtualHost>
