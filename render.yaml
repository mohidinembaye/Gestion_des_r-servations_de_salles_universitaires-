# Render Blueprint Specification
databases:
  - name: reservation-db
    databaseName: reservation_salles
    user: reservation_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: reservation-salles-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: reservation-db
          property: connectionString
